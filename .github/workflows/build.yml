name: Build APK

on:
  push:
    # family 分支是給家人的正式版，由 family.yml 打包，不要蓋掉「最新測試版」
    branches-ignore: [family]
    # 只是在主題下載區放主題，不用重新打包 App
    paths-ignore: ["store/**", "tools/build_store.py", ".github/workflows/store.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk catpaw-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: catpaw-keyboard-apk
          path: catpaw-keyboard.apk

      # 放到 Releases 頁面，手機上點一下就能下載
      - name: Publish "最新測試版"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build catpaw-keyboard.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新測試版 #${{ github.run_number }}" \
            --notes "測試版（App 名稱：貓爪鍵盤 測試版），可以跟 Google Play 正式版同時安裝。分支：${{ github.ref_name }}　commit：${{ github.sha }}"
          # 新版 gh 會先建成草稿、傳完檔案才公開；有時候停在草稿，下載連結就 404。這裡一定要公開
          gh release edit dev-build --draft=false
          # 確認真的公開了（還是草稿就讓這次建置失敗，才看得出來）
          test "$(gh release view dev-build --json isDraft --jq .isDraft)" = "false"
