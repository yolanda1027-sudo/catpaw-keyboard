name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk catpaw-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: catpaw-keyboard-apk
          path: catpaw-keyboard.apk

      # 放到 Releases 頁面，手機上點一下就能下載
      - name: Publish "最新測試版"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build catpaw-keyboard.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "最新測試版 #${{ github.run_number }}" \
            --notes "分支：${{ github.ref_name }}　commit：${{ github.sha }}"
